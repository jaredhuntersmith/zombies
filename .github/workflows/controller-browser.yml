name: Controller and Kino browser checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controller-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KINO_CI_DPR: '0.5'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Fetch Kino assets
        run: git lfs pull --exclude='export/web/moon/**,export/web/ascension/**,export/web/coast/**,export/web/shangri-la/**'
      - run: npm ci
      - name: Prepare Chrome and test recorder
        run: |
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          npx playwright-core install ffmpeg
      - name: Start Kino
        run: |
          mkdir -p artifacts/qa
          npm start > artifacts/server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/__health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Controller integration
        run: node .tools/test-gamepad.mjs
      - name: Existing Kino gameplay checks
        env:
          NODE_OPTIONS: --import=./.tools/browser-test-env.mjs
        run: |
          npm run test:gameplay
          npm run test:extras
          npm run test:weapons
          npm run test:completion
          npm run test:presentation
          npm run test:melee
          npm run test:zombies
          npm run test:routes
          npm run test:mobile -- --kino
      - name: Keep reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kino-controller-browser-reports
          path: |
            artifacts/gamepad
            artifacts/qa
            artifacts/weapons
            artifacts/completion
            artifacts/presentation
            artifacts/melee
            artifacts/zombies
            artifacts/mobile
            artifacts/physical-routes.json
            artifacts/server.log
